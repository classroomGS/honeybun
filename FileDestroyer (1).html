  <title>Honeybun Button</title>
  <style>
    body {
      background: #fff8e7; /* soft cream background */
      font-family: 'Trebuchet MS', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    button {
      width: 250px;
      height: 250px;
      border-radius: 50%; /* perfectly round bun */
      background: radial-gradient(circle at 30% 30%, #f9d976, #f39c12);
      color: #4a2c0a;
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: inset -5px -5px 15px rgba(255,255,255,0.6),
                  inset 5px 5px 15px rgba(0,0,0,0.2),
                  0 10px 20px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      transition: transform 0.4s ease;
    }

    /* shiny glaze effect */
    button::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255,255,255,0.4), transparent 60%);
      transform: rotate(25deg);
      animation: glaze 3s infinite linear;
    }

    @keyframes glaze {
      0% { transform: translateX(-100%) rotate(25deg); }
      100% { transform: translateX(100%) rotate(25deg); }
    }

    button:hover {
      transform: scale(1.1) rotate(5deg);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
